[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://example.invalid/verso"
authors = ["Verso"]

[workspace.dependencies]
verso-core = { path = "core" }
base64 = "0.22"
csv = "1.3"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
image24 = { package = "image", version = "0.24", default-features = false }
pdf-extract = "0.12"
pdfium-render = "0.8"
printpdf = { version = "0.7", features = ["embedded_images"] }
pulldown-cmark = "0.13"
rayon = "1.11"
roxmltree = "0.20"
rfd = "0.15"
scraper = "0.24"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
webp = "0.3"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
